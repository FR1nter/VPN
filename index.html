<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRINTER</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 440px;
            width: 100%;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* Контейнер для уведомлений (изначально скрыты и прозрачны) */
        .alert-box {
            display: none;
            opacity: 0;
            background-color: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            transition: opacity 0.3s ease;
        }

        .theme-btn {
            background: none;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .subscription-box {
            background-color: #1f2937;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #374151;
        }

        .sub-title {
            color: #9ca3af;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        /* Кнопки в один ряд */
        .buttons-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .copy-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: #2563eb;
        }

        .footer-logo {
            font-weight: bold;
            font-size: 18px;
            color: #4b5563;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">FRINTER</div>

        <!-- Окна уведомлений -->
        <div id="alert-happ" class="alert-box">
            Подписка скопирована ✅. Добавьте её в VPN-клиент — Happ.
        </div>
        <div id="alert-incy" class="alert-box">
            Подписка скопирована ✅. Добавьте её в incy.
        </div>

        <button class="theme-btn">
            ⛶ Сменить тему
        </button>

        <div class="subscription-box">
            <div class="sub-title">⚡ ваша подписка</div>
            
            <div class="buttons-row">
                <button id="btn-happ" class="copy-btn">
                    ⬇ скопировать Happ
                </button>
                <button id="btn-incy" class="copy-btn">
                    ⬇ скопировать Incy
                </button>
            </div>

            <div class="footer-logo">FRINTER</div>
        </div>
    </div>

    <script>
        let timeoutId;

        // Универсальная функция копирования текста и показа уведомления
        function handleCopy(textToCopy, alertIdToShow) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                // Сбрасываем старый таймер, если он был активен
                clearTimeout(timeoutId);

                // Прячем абсолютно все уведомления
                document.querySelectorAll('.alert-box').forEach(alert => {
                    alert.style.display = 'none';
                    alert.style.opacity = '0';
                });
                
                // Включаем и плавно показываем нужное уведомление
                const alertBox = document.getElementById(alertIdToShow);
                alertBox.style.display = 'block';
                setTimeout(() => {
                    alertBox.style.opacity = '1';
                }, 10);

                // Автоматически скрываем плавно через 4 секунды
                timeoutId = setTimeout(() => {
                    alertBox.style.opacity = '0';
                    setTimeout(() => {
                        alertBox.style.display = 'none';
                    }, 300); // время завершения CSS transition
                }, 4000);

            }).catch(err => {
                console.error('Ошибка при копировании: ', err);
            });
        }

        // Первая кнопка копирует "привет" и показывает окно для Happ
        document.getElementById('btn-happ').addEventListener('click', () => {
            handleCopy('привет', 'alert-happ');
        });

        // Вторая кнопка копирует "67" и показывает окно для Incy
        document.getElementById('btn-incy').addEventListener('click', () => {
            handleCopy('привет', 'alert-incy');
        });
    </script>

</body>
</html>
