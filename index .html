<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRINTER</title>
    <style>
        /* Переменные для быстрой смены темы */
        :root {
            --bg-animation-light: linear-gradient(45deg, #ffffff, #f0f0f0, #e0e0e0, #f5f5f5, #ffffff);
            --bg-animation-dark: linear-gradient(45deg, #0a0a0a, #1a1a1a, #262626, #141414, #0a0a0a);
            --text-color: #ffffff;
            --border-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.04);
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --toast-bg: rgba(255, 255, 255, 0.95);
            --toast-text: #000000;
        }

        [data-theme="light"] {
            --text-color: #000000;
            --border-color: #000000;
            --card-bg: rgba(0, 0, 0, 0.04);
            --btn-bg: #000000;
            --btn-text: #ffffff;
            --toast-bg: rgba(0, 0, 0, 0.9);
            --toast-text: #ffffff;
        }

        /* Быстрая установка темы до отрисовки интерфейса (защита от вспышек) */
        html {
            background-color: #0a0a0a;
        }
        html[data-theme="light"] {
            background-color: #ffffff;
        }

        /* Общие стили и диагональная анимация фона */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Смещено строго к середине экрана по вертикали */
            padding: 20px;
            box-sizing: border-box;
            background: var(--bg-animation-dark);
            background-size: 600% 600%;
            animation: blanketWave 18s ease-in-out infinite;
            transition: color 0.5s ease;
            overflow: hidden; /* Запрещает появление полос прокрутки для полноэкранного режима */
            position: relative;
        }

        [data-theme="light"] body {
            background: var(--bg-animation-light);
            background-size: 600% 600%;
            animation: blanketWave 18s ease-in-out infinite;
        }

        @keyframes blanketWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Эффект плавного появления элементов сверху вниз */
        .fade-item {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }

        /* Кнопка переключения темы в правом верхнем углу */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .theme-toggle:hover {
            background: var(--text-color);
            color: var(--btn-text);
        }

        /* Главный контейнер, центрирующий все блоки */
        .wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Шапка с отступом */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; 
            margin-bottom: 25px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin: 0;
            line-height: 1;
        }

        .lightning {
            font-size: 2.3rem;
            filter: grayscale(100%);
            line-height: 1;
        }

        /* Блок контента */
        main {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Стили для компактной рамки */
        .card {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            transition: border-color 0.5s ease, background-color 0.5s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 185px; 
            box-sizing: border-box;
        }

        .card.animating-border {
            animation: greyBorderGlow 4s ease-in-out;
        }

        @keyframes greyBorderGlow {
            0% { border-color: var(--border-color); }
            25% { border-color: #b3b3b3; }
            50% { border-color: #555555; }
            75% { border-color: #888888; }
            100% { border-color: var(--border-color); }
        }

        .card h2 {
            margin: 0 0 12px 0;
            font-size: 1.3rem;
            font-weight: 600;
            pointer-events: none;
        }

        .arrow {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 12px;
            pointer-events: none;
        }

        /* Кнопка копирования */
        .copy-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 11px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.5s ease, color 0.5s ease;
            width: 80%;
            max-width: 280px;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        /* Всплывающее окно (Toast) */
        .toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--toast-bg);
            color: var(--toast-text);
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            opacity: 0;
            text-align: center;
            width: 85%;
            max-width: 400px;
            pointer-events: none;
        }

        .toast.show {
            bottom: 40px;
            opacity: 1;
        }

        /* Подвал отодвинут на фиксированное расстояние вниз от рамки */
        footer {
            margin-top: 32px; 
            text-align: center;
            flex-shrink: 0;
            width: 100%;
        }

        .footer-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0.25;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.3s ease, color 0.5s ease;
            user-select: none;
        }

        .footer-link:hover {
            opacity: 0.7;
        }

        .tg-icon {
            width: 22px;
            height: 22px;
            fill: #0088cc;
        }

        /* Адаптивность под ПК */
        @media (min-width: 768px) {
            .wrapper {
                max-width: 550px;
            }
            header {
                margin-bottom: 30px;
            }
            .logo {
                font-size: 4.2rem;
                letter-spacing: 7px;
            }
            .lightning {
                font-size: 3.5rem;
            }
            .card {
                padding: 35px;
                border-radius: 24px;
                min-height: 230px; 
            }
            .card h2 {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }
            .arrow {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }
            .copy-btn {
                padding: 14px 28px;
                font-size: 1.1rem;
                max-width: 300px;
            }
            .footer-link {
                font-size: 1.3rem;
                gap: 12px;
            }
            .tg-icon {
                width: 26px;
                height: 26px;
            }
            .toast {
                font-size: 1.05rem;
            }
        }
    </style>
    <script>
        // Инициализация темы до рендеринга страницы (защита от белых вспышек)
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>
<body>

    <!-- Всплывающее уведомление -->
    <div class="toast" id="toastNotification">
        Подписка скопирована ✅. Добавьте её в VPN-клиент — Happ.
    </div>

    <!-- Кнопка смены темы -->
    <button class="theme-toggle" id="themeToggle">Сменить тему</button>

    <div class="wrapper">
        <header class="fade-item delay-1">
            <div class="logo">FRINTER</div>
            <div class="lightning">⚡</div>
        </header>

        <main class="fade-item delay-2">
            <div class="card" id="mainCard">
                <h2>Ваша подписка ⬇</h2>
                <h2></h2>
                <button class="copy-btn" id="copyBtn">Скопировать</button>
            </div>
        </main>

        <footer class="fade-item delay-3">
            <a href="https://t.me/FR1nter" target="_blank" class="footer-link">
                <svg class="tg-icon" viewBox="0 0 24 24">
                    <path d="M21.94 5.65c-.17-.3-.48-.5-.83-.53l-18-1.5c-.44-.04-.85.19-1.02.6-.17.41-.05.88.29 1.17l4.5 3.9c.2.17.47.24.73.18l4.47-1.03-3.12 3.93c-.15.19-.2.44-.15.68l1.5 6.5c.08.36.35.65.71.74.07.02.14.03.21.03.29 0 .57-.13.75-.36l4.2-5.4 4.14 3.03c.23.17.52.22.79.13.27-.09.48-.3.56-.57l3.5-12c.11-.38-.01-.79-.25-1.02zm-14.3 2.87l-2.48-2.15 13.04.14-10.56 2.01zm6.05 4.3l-2.07 2.61-.48-2.08 2.55-.53z"/>
                </svg>
                FRINTER
            </a>
        </footer>
    </div>

    <script>
        // --- Логика автоматического перевода в Fullscreen при первом взаимодействии ---
        function activateFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Инфо: Полноэкранный режим ожидает клика пользователя: \${err.message}`);
                });
            }
        }
        // Запрос полноэкранного режима при клике в любой точке экрана
        document.body.addEventListener('click', activateFullscreen, { once: false });

        // --- Интерактивная логика страниц ---
        const mainCard = document.getElementById('mainCard');
        mainCard.addEventListener('click', () => {
            if (!mainCard.classList.contains('animating-border')) {
                mainCard.classList.add('animating-border');
                setTimeout(() => {
                    mainCard.classList.remove('animating-border');
                }, 4000);
            }
        });

        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toastNotification');
        const textToCopy = "привет";
        let toastTimeout;

        copyBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.textContent = 'Скопировано ✅';
                setTimeout(() => {
                    copyBtn.textContent = 'Скопировать';
                }, 2000);

                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);

            }).catch(err => {
                console.error('Ошибка при копировании: ', err);
            });
        });

        // --- Логика переключения тем с сохранением в localStorage ---
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                htmlElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
